version: 2
project_name: sub2api-panel
before:
  hooks:
    - go run . update validate-build {{.Tag}} {{.IsSnapshot}}
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build
builds:
  - binary: sub2api-panel
    env:
      - CGO_ENABLED=0
    tags:
      - panel_release
    ldflags:
      - -s -w -X main.version={{if index .Env "PANEL_PRODUCT_VERSION"}}{{.Env.PANEL_PRODUCT_VERSION}}{{else}}{{.Version}}{{end}} -X main.commit={{.Commit}}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ if index .Env "PANEL_PRODUCT_VERSION" }}{{ .Env.PANEL_PRODUCT_VERSION }}{{ else }}{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - LICENSE
      - src: deploy/postgres-grants.sql
        strip_parent: true
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
release:
  draft: true
  prerelease: auto
  name_template: 'Sub2API Panel {{ if index .Env "PANEL_PRODUCT_VERSION" }}{{ .Env.PANEL_PRODUCT_VERSION }}{{ else }}{{ .Version }}{{ end }}'
  extra_files:
    - glob: ./release-input/update-manifest.json
