version: 2
project_name: sub2api-panel
before:
  hooks:
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build
builds:
  - binary: sub2api-panel
    env:
      - CGO_ENABLED=0
    tags:
      - panel_release
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
